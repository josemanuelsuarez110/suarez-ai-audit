name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform checks
        run: npm run check:platform

      - name: E2E static checks
        run: npm run check:e2e

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - quality

    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:5173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check E2E secrets
        id: e2e_secrets
        shell: bash
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ] && [ -n "$VITE_SUPABASE_URL" ] && { [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || [ -n "$VITE_SUPABASE_ANON_KEY" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated E2E skipped: required repository secrets are not configured."
          fi

      - name: Checkout
        if: steps.e2e_secrets.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.e2e_secrets.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.e2e_secrets.outputs.enabled == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.e2e_secrets.outputs.enabled == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        if: steps.e2e_secrets.outputs.enabled == 'true'
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e_secrets.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: ${{ failure() && steps.e2e_secrets.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
